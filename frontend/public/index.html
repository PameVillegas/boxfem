<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>FemmBox - Gestión de Gimnasio</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; background: #0d0d0d; color: #fff; }
    #root { overflow-x: hidden; }
    .ant-card { background: rgba(30,30,30,0.7) !important; backdrop-filter: blur(12px) !important; border: 1px solid rgba(255,20,147,0.15) !important; box-shadow: 0 4px 24px rgba(255,20,147,0.08) !important; transition: all 0.3s ease !important; }
    .ant-card:hover { box-shadow: 0 8px 32px rgba(255,20,147,0.15) !important; transform: translateY(-1px); }
    .ant-modal-content { background: #252525 !important; backdrop-filter: none !important; border: 1px solid #ff1493 !important; color: #fff !important; box-shadow: 0 8px 40px rgba(255,20,147,0.2) !important; }
    .ant-modal-content .ant-card { backdrop-filter: none !important; background: #2a2a2a !important; }
    .ant-btn-primary { background: linear-gradient(135deg, #ff1493, #c2185b) !important; border: none !important; box-shadow: 0 4px 16px rgba(255,20,147,0.3) !important; transition: all 0.2s ease !important; }
    .ant-btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 24px rgba(255,20,147,0.4) !important; }
    .ant-tag { border-radius: 20px !important; }
    .ant-statistic-title { color: #aaa !important; }
    .ant-statistic-content { color: #fff !important; }
    .ant-table { background: transparent !important; }
    .ant-input, .ant-select-selector, .ant-picker { background: rgba(40,40,40,0.8) !important; border-color: #444 !important; }
    .ant-modal-mask { background: rgba(0,0,0,0.45) !important; }
    .ant-modal-header { background: #252525 !important; border-bottom: 1px solid #444 !important; }
    .ant-modal-header .ant-modal-title { color: #ff1493 !important; font-weight: bold !important; }
    .ant-modal-footer { background: #252525 !important; border-top: 1px solid #444 !important; }
    .ant-modal-body { color: #fff !important; }
    .ant-modal-body * { color: inherit; }
    .ant-modal-close-x { color: #888 !important; }
    .ant-modal-wrap { z-index: 1000 !important; }
    .ant-form-item-label > label { color: #ccc !important; }
    .ant-select-dropdown { background: #1e1e1e !important; border: 1px solid #444 !important; }
    .ant-select-item { color: #fff !important; }
    .ant-select-item-option-active { background: #333 !important; }
    .ant-select-item-option-selected { background: #3a1a2a !important; }
    .ant-picker-dropdown { background: #1e1e1e !important; }
    .ant-picker-panel-container { background: #1e1e1e !important; }
    .ant-picker-header, .ant-picker-body { color: #fff !important; }
    .ant-picker-cell-inner { color: #ccc !important; }
    .ant-picker-cell-selected .ant-picker-cell-inner { background: #ff1493 !important; }
    .ant-popover-inner, .ant-popconfirm .ant-popover-inner { background: #1e1e1e !important; }
    .ant-popover-message-title { color: #fff !important; }
    .ant-select-selection-item { color: #fff !important; }
    .ant-select-selection-placeholder { color: #666 !important; }
    .ant-input-number, .ant-input-number-input { background: rgba(40,40,40,0.8) !important; color: #fff !important; }
    .ant-picker-input > input { color: #fff !important; }
    .ant-picker-suffix { color: #888 !important; }
    .ant-picker-clear { background: #1e1e1e !important; }
    .ant-select-clear { background: #1e1e1e !important; }
    .ant-drawer-content { background: #1a1a1a !important; }
    .ant-drawer-header { background: #1a1a1a !important; border-bottom: 1px solid #333 !important; }
    .ant-drawer-title { color: #fff !important; }
    .ant-menu-item { color: #ccc !important; }
    .ant-menu-item-selected { color: #ff1493 !important; background: rgba(255,20,147,0.1) !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1a1a; }
    ::-webkit-scrollbar-thumb { background: #ff1493; border-radius: 3px; }
  </style>
  <div id="root"></div>
</body>
</html>
